<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sisters Meet - Church At Guntur</title>
    <!-- This will ALWAYS run -->
    <meta http-equiv="refresh" content="0; URL=https://meet.google.com/zyq-zygx-tym">
    <meta name="theme-color" content="#0B1023">
    <link rel="manifest" href="/church/manifest.json" crossorigin="use-credentials">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:site_name" content="Melam Rahul">       
    <meta property="og:title" content="Sisters Meet - Church At Guntur">
    <meta property="og:description" content="Join for Sisters Meet Every Wednesday at 8 PM.">
    <meta property="og:url" content="https://Melam.Rahul">
    <meta property="og:image" content="https://i.ibb.co/0Jsxc9B/Copy-of-Copy-of-Church-20241221-122715-0001-11zon.png">
    <meta property="og:image:width" content="32">
    <meta property="og:image:height" content="32">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0B1023;
            color: white;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            -tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        .top-nav {
            background-color: #293B66;
            padding: 10px 20px;
            display: flex;
            margin-top: -10px;
            margin-bottom: 15px;
            align-items: center;
            justify-content: space-between;
            border-radius: 20px;
        }

        .top-nav img {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .top-nav h3 {
            font-size: 20px;
            margin: 0;
            color: white;
            text-align: center;
            flex-grow: 1;
        }
        .progsection {
            margin-top: 200px;
            background-color: #1C2B4F;
            padding: 20px;
            height: 180px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .progsection h2 {
            font-size: 22px;
            font-weight: 600;
            color: white;
            margin-bottom: 20px;
            text-align: left;
        }

        .progsection ul {
            list-style-type: none;
            padding-left: 0;
        }

        .progsection li {
            font-size: 16px;
            color: white;
            margin-bottom: 10px;
            background-color: #293B66;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
        }
        .pro {
            font-size: 16px;
            color: white;
            margin-bottom: 10px;
            padding: 10px;
            background-color: #1C2B4F;   
            border-radius: 8px;
            display: flex;
            align-items: center;
         }
        .progsection li:before {
            color: #4AC1E8;
            font-weight: bold;
            font-size: 12px;
            margin-right: 10px;
        }

        .progsection li:last-child {
            margin-bottom: 0;
        }

        .button {
            padding: 12px 20px;
            font-size: 18px;
            text-align: center;
            cursor: pointer;
            outline: none;
            color: #fff;
            background-color: #4AC1E8;
            border: none;
            border-radius: 10px;
            box-shadow: 0 6px #293B66;
        }

        .button:hover {
            background-color: #3A9BBE;
        }

        .button:active {
            background-color: #3A9BBE;
            box-shadow: 0 4px #0A1A36;
            transform: translateY(4px);
        }

        .hidden {
            display: none;
        }

        .expired-message, .invalid-link-message {
            color: #FF6F6F;
            font-size: 16px;
            text-align: center;
        }

        /* Loader styles for brief display during redirect */
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #4AC1E8;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Content will only be shown if there's an error or validation issue -->
    <div class="container" id="programs-section" style="margin-top: 20px;">
        <div class="top-nav">
            <img src="https://cdn-icons-png.flaticon.com/512/786/786399.png" alt="back" onclick="window.location.href='https://church-at-guntur.github.io/church/'">
            <h3>Sisters Meet</h3>
        </div>
        <div class="progsection">
            <div id="loader" class="loader"></div>
            <ul id="program-list" style="list-style-type: none; padding: 0; margin-top: 20px;">
                <li id="meet-info" style="display: flex; align-items: flex-start; margin-bottom: 10px;">
                    <img src="https://cdn-icons-png.flaticon.com/512/4547/4547141.png" alt="👉🏻"
                        style="height: 50px; width: 50px; margin-right: 10px;">
                    <div>
                        <strong>Sisters Meet:</strong> <br>
                        <span style="font-size: 14px; color: #A0A3BD;">Every Wednesday at 8PM</span>
                    </div>
                </li>
                <div id="join-section" class="pro" style="display: flex; align-items: center; justify-content: center;">
                    <button class="button" id="join-button" onclick="redirectToMeeting()">
                        Join Meeting
                    </button>
                </div>
            </ul>
            <div id="expiry-message" class="expired-message hidden">
                Sisters Meet Link has been Expired 😢 <br>
                <p>Request new from Meeting Host</p>
            </div>
            <div id="invalid-link-message" class="invalid-link-message hidden">
                Invalid Meeting Link 🛑 <br>
                <p>Please check the link or contact the Meeting Host.</p>
            </div>
        </div>
    </div>
    <script>
        function decodeTimestamp(encodedTimestamp) {
            return new Date(encodedTimestamp * 1000);
        }
    
        function encodeTimestamp(date) {
            return Math.floor(date.getTime() / 1000);
        }
    
        function isLinkExpired(expiryDate) {
            return new Date() > expiryDate;
        }
    
        function displayInvalidLinkMessage() {
            document.getElementById('meet-info')?.remove();
            document.getElementById('join-section')?.remove();
            document.getElementById('invalid-link-message')?.classList.remove('hidden');
        }
    
        function redirectToGoogleMeet() {
            // Replace with your actual Google Meet link
            window.location.replace('https://meet.google.com/zyq-zygx-tym');
        }
    
        function checkExpiryAndRedirect() {
            const urlParams = new URLSearchParams(window.location.search);
            const encodedTimestamp = urlParams.get('Id');
    
            if (encodedTimestamp) {
                const timestamp = Number(encodedTimestamp);
    
                if (!isNaN(timestamp) && timestamp > 0) {
                    const expiryDate = decodeTimestamp(timestamp);
                    const maxValidTimestamp = encodeTimestamp(new Date(Date.now() + 24 * 60 * 60 * 1000));
    
                    if (timestamp <= maxValidTimestamp && !isLinkExpired(expiryDate)) {
                        redirectToGoogleMeet();
                        return;
                    }
                }
            }
    
            // Show error message if invalid or expired
            displayInvalidLinkMessage();
        }
    
        window.onload = checkExpiryAndRedirect;
    </script>
    
</body>
</html>
